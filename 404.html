<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não Encontrada | SuperFacil Informática</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background-color: transparent;
            /* Changed from solid to transparent */
            z-index: 10;
            /* Put the text and buttons ON TOP of everything */
        }

        /* Overlay para o background ficar escuro e tech * /
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(7, 9, 15, 0.65); /* Made slightly lighter */
        backdrop-filter: blur(2px);
        z-index: 2;
        pointer-events: none;
        /* Prevents blocking clicks */
        }

        .random-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            /* Filter can also be used here instead of overlay */
        }

        .error-content {
            position: relative;
            z-index: 3;
            max-width: 600px;
            padding: 40px;
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
        }

        .error-text {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: white;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .logo-404 {
            width: 250px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
        }
    </style>
</head>

<body>

    <!-- A DIV que receberá a imagem randômica -->
    <div id="dynamic-bg" class="random-bg"></div>
    <div class="bg-overlay"></div>

    <section class="error-section">
        <div class="error-content">
            <a href="index.html">
                <img src="images/logo.png" alt="SuperFacil Logo" class="logo-404">
            </a>
            <h1 class="error-code">404</h1>
            <h2 class="error-text">Opa! Nada por aqui.</h2>
            <p class="error-desc">
                O servidor caiu em um buraco negro ou a página que você tentou acessar não existe mais.
                Que tal voltarmos para a segurança da nossa base de operações?
            </p>
            <a href="index.html" class="btn-glow">
                <i class="fa-solid fa-house"></i> Voltar para a Home
            </a>
        </div>
    </section>

    <script>
        // Array de imagens de computadores quebrados / servidores acidentados retirados de bancos gratuitos
        const brokenImages = [
            "images/broken1.png", // Computador Quebrado / Desmontado
            "images/broken2.png", // Erro de código retro glitched
            "images/broken3.png"  // Circuito queimado tech abstrato
        ];

        // Sorteia um número matemático de 0 até o total de imagens
        const randomElement = brokenImages[Math.floor(Math.random() * brokenImages.length)];

        // Aplica na DIV de fundo
        document.getElementById("dynamic-bg").style.backgroundImage = `url('${randomElement}')`;
    </script>
</body>

</html>
